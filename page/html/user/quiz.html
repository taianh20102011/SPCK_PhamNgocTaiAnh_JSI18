<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainlyX - Quiz & Luyện tập</title>
  <link rel="stylesheet" href="../../../assets/css/basic.css">
  <link rel="stylesheet" href="../../../assets/css/quiz.css">
  <link rel="stylesheet" href="../../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../../assets/css/app-shell.css">
</head>

<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand" aria-label="BrainlyX"><img src="../../../assets/images/brainlyx-logo.svg" alt="BrainlyX"></div>
      <ul class="nav-menu">
        <li><a href="dashboard.html" class="nav-link">📊 Dashboard</a></li>
        <li><a href="comming.html" class="nav-link">📅 Thời khóa biểu</a></li>
        <li><a href="note.html" class="nav-link">📝 Sổ tay</a></li>
        <li><a href="quiz.html" class="nav-link active">🧠 Luyện tập</a></li>
        <li><a href="knowledge.html" class="nav-link">📚 Kho kiến thức</a></li>
      </ul>
      <!-- User Profile Widget Container -->
      <div class="user-profile-summary">
        <div style="display: flex; justify-content: space-between;">
          <span id="user-display-name" style="font-weight: 700;">Đang tải...</span>
          <span id="user-level" style="color: var(--accent-warning); font-weight: 700;">Lv.1</span>
        </div>
        <div class="exp-bar-container">
          <div id="user-exp-bar" class="exp-bar-fill"></div>
        </div>
        <!-- <a style="text-decoration: none;" href="user.html" ><button class="btn">👤 Profile</button></a>
        <button id="btn-logout" class="btn" style="color: var(--accent-danger); margin-top: 12px; padding: 0;">Đăng
          xuất</button> -->
      </div>
    </aside>

    <main class="main-content">
      <header class="app-page-header">
        <div>
          <h1>Luyện tập</h1>
          <p>Kiểm tra kiến thức, nhận điểm và EXP sau mỗi bài.</p>
        </div>
        <div class="header-actions"><span class="header-badge">🚀 BrainlyX</span><a class="btn" href="user.html">👤 Hồ
            sơ</a><button class="btn" data-action="logout">Đăng xuất</button></div>
      </header>

      <div class="quiz-container">
        <div class="glass-card"
          style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
          <h2 id="quiz-title">Bài trắc nghiệm kiến thức</h2>
          <div>Điểm: <span id="quiz-score" style="color: var(--accent-success); font-weight: bold;">0</span></div>
        </div>

        <!-- Khung chứa câu hỏi trắc nghiệm (Nội dung render từ JS/Firebase) -->
        <div id="quiz-question-card" class="glass-card">
          <h3 id="quiz-question-text" style="margin-bottom: 20px;">Đang tải câu hỏi...</h3>
          <div id="quiz-options-container">
            <!-- JS Render các đáp án vào đây -->
          </div>
          <button id="btn-next-question" class="btn btn-primary" style="margin-top: 20px; float: right;">Câu tiếp theo
            ➔</button>
          <div style="clear: both;"></div>
        </div>
      </div>

      <footer class="app-footer"><span>© 2026 BrainlyX • Nền tảng học tập cá nhân</span><span><a
            href="feedback.html">Góp ý</a> · <a href="../../../index.html">Trang chủ</a></span></footer>
    </main>
  </div>
  <script src="../../../assets/js/menu-toggle.js"></script>
  <script type="module" src="../../../assets/js/quiz.js"></script>
  <script type="module" src="../../../assets/js/app-shell.js"></script>
  <script>
    (function () { if (!window.chatbase || window.chatbase("getState") !== "initialized") { window.chatbase = (...args) => { if (!window.chatbase.q) { window.chatbase.q = [] } window.chatbase.q.push(arguments) }; window.chatbase = new Proxy(window.chatbase, { get(target, prop) { if (prop === "q") { return target.q } return (...args) => target(prop, ...args) } }) } const onLoad = function () { const script = document.createElement("script"); script.src = "https://www.chatbase.co/embed.min.js"; script.id = "e4qdiWBuEAj-3NVi9OOtC"; script.domain = "www.chatbase.co"; document.body.appendChild(script) }; if (document.readyState === "complete") { onLoad() } else { window.addEventListener("load", onLoad) } })();
  </script>
</body>

</html>
