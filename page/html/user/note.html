<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainlyX - Sổ tay kiến thức</title>
  <link rel="stylesheet" href="../../../assets/css/basic.css">
  <link rel="stylesheet" href="../../../assets/css/note.css">
  <link rel="stylesheet" href="../../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../../assets/css/app-shell.css">
</head>

<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand" aria-label="BrainlyX"><img src="../../../assets/images/brainlyx-logo.svg" alt="BrainlyX"></div>
      <ul class="nav-menu">
        <li><a href="dashboard.html" class="nav-link">📊 Dashboard</a></li>
        <li><a href="comming.html" class="nav-link">📅 Thời khóa biểu</a></li>
        <li><a href="note.html" class="nav-link active">📝 Sổ tay</a></li>
        <li><a href="quiz.html" class="nav-link">🧠 Luyện tập</a></li>
        <li><a href="knowledge.html" class="nav-link">📚 Kho kiến thức</a></li>
      </ul>
      <!-- User Profile Widget Container -->
      <div class="user-profile-summary">
        <div style="display: flex; justify-content: space-between;">
          <span id="user-display-name" style="font-weight: 700;">Đang tải...</span>
          <span id="user-level" style="color: var(--accent-warning); font-weight: 700;">Lv.1</span>
        </div>
        <div class="exp-bar-container">
          <div id="user-exp-bar" class="exp-bar-fill"></div>
        </div>
        <!-- <a style="text-decoration: none;" href="user.html" ><button class="btn">👤 Profile</button></a>
        <button id="btn-logout" class="btn" style="color: var(--accent-danger); margin-top: 12px; padding: 0;">Đăng
          xuất</button> -->
      </div>
    </aside>

    <main class="main-content">
      <header class="app-page-header">
        <div>
          <h1>Sổ tay</h1>
          <p>Lưu công thức, kiến thức và hình ảnh học tập của bạn.</p>
        </div>
        <div class="header-actions"><span class="header-badge">🚀 BrainlyX</span><a class="btn" href="user.html">👤 Hồ
            sơ</a><button class="btn" data-action="logout">Đăng xuất</button></div>
      </header>

      <div class="notes-layout">
        <!-- Sidebar Danh sách ghi chú -->
        <div class="glass-card notes-sidebar">
          <button id="btn-create-note" class="btn btn-primary" style="width: 100%; justify-content: center;">+ Ghi chú
            mới</button>
          <input type="text" id="note-search" class="input-field" placeholder="Tìm ghi chú...">
          <div id="notes-list" class="notes-list">
            <!-- Dynamic notes item rendered via JS -->
          </div>
        </div>

        <!-- Vùng soạn thảo ghi chú -->
        <div class="glass-card note-editor">
          <input type="text" id="note-title-input" class="input-field" placeholder="Tiêu đề bài học / Công thức..."
            style="font-size: 1.2rem; font-weight: bold;">

          <select id="note-subject-select" class="input-field">
            <option value="math">Toán Học</option>
            <option value="physics">Vật Lý</option>
            <option value="chemistry">Hóa Học</option>
            <option value="english">Tiếng Anh</option>
            <option value="literature">Ngữ Văn</option>
            <option value="it">Tin học</option>
            <option value="bio">Sinh học</option>
          </select>

          <textarea id="note-content-input" class="input-field"
            placeholder="Nhập nội dung ghi chú, công thức tại đây..."></textarea>

          <img id="note-image-preview" class="note-image-preview hidden" alt="Ảnh ghi chú" style="margin-bottom:10px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <input type="file" id="note-image-upload" accept="image/png,image/jpeg,image/webp" style="display:none">
            <div class="note-image-tools"><button type="button" id="btn-note-image" class="btn">📷 Đính kèm
                ảnh</button><span id="note-image-name" class="note-image-name">Chưa chọn ảnh</span></div>

            <div style="display: flex; gap: 8px;">
              <button id="btn-delete-note" class="btn" style="color: var(--accent-danger);">Xóa</button>
              <button id="btn-save-note" class="btn btn-primary">Lưu Ghi Chú</button>
            </div>
          </div>
        </div>
      </div>

      <footer class="app-footer"><span>© 2026 BrainlyX • Nền tảng học tập cá nhân</span><span><a
            href="feedback.html">Góp ý</a> · <a href="../../../index.html">Trang chủ</a></span></footer>
    </main>
  </div>
  <script src="../../../assets/js/menu-toggle.js"></script>
  <script type="module" src="../../../assets/js/note.js"></script>
  <script type="module" src="../../../assets/js/app-shell.js"></script>
  <script>
    (function () { if (!window.chatbase || window.chatbase("getState") !== "initialized") { window.chatbase = (...args) => { if (!window.chatbase.q) { window.chatbase.q = [] } window.chatbase.q.push(arguments) }; window.chatbase = new Proxy(window.chatbase, { get(target, prop) { if (prop === "q") { return target.q } return (...args) => target(prop, ...args) } }) } const onLoad = function () { const script = document.createElement("script"); script.src = "https://www.chatbase.co/embed.min.js"; script.id = "e4qdiWBuEAj-3NVi9OOtC"; script.domain = "www.chatbase.co"; document.body.appendChild(script) }; if (document.readyState === "complete") { onLoad() } else { window.addEventListener("load", onLoad) } })();
  </script>
</body>

</html>
