<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainlyX - Đăng ký</title>
  <link rel="stylesheet" href="../../../assets/css/basic.css">
  <link rel="stylesheet" href="../../../assets/css/auth.css">
  <link rel="stylesheet" href="../../../assets/css/responsive.css">
  <link rel="stylesheet" href="../../../assets/css/app-shell.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="glass-card auth-card">
      <a href="../../../index.html" class="back-home">← Quay về trang chủ</a>

      <div class="auth-header">
        <h1 class="brand auth-brand" style="justify-content: center; margin-bottom: 8px;"><img src="../../../assets/images/brainlyx-logo.svg" alt="BrainlyX"></h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Tạo tài khoản học tập mới</p>
      </div>

      <form id="register-form" class="auth-form" onsubmit="return false;">
        <div class="form-group">
          <label for="register-name">Họ và Tên</label>
          <input type="text" id="register-name" class="input-field" required placeholder="Nguyễn Văn A">
        </div>

        <div class="form-group">
          <label for="register-role">Vai trò tài khoản</label>
          <select id="register-role" class="input-field" required>
            <option value="student" selected>Học sinh (Student)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="register-grade">Khối lớp</label>
          <select id="register-grade" class="input-field" required>
            <option value="" disabled selected>-- Chọn khối lớp --</option>
            <option value="6">Khối 6</option>
            <option value="7">Khối 7</option>
            <option value="8">Khối 8</option>
            <option value="9">Khối 9</option>
            <option value="10">Khối 10</option>
            <option value="11">Khối 11</option>
            <option value="12">Khối 12</option>
          </select>
        </div>

        <div class="form-group">
          <label for="register-email">Email học sinh</label>
          <input type="email" id="register-email" class="input-field" required placeholder="hocsinh@brainlyx.edu.vn">
        </div>

        <div class="form-group">
          <label for="register-password">Mật khẩu</label>
          <input type="password" id="register-password" class="input-field" required placeholder="••••••••">
        </div>

        <button type="submit" id="btn-register" class="btn btn-primary" style="width: 100%; justify-content: center;">Đăng Ký Tài Khoản</button>
      </form>

      <p style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">
        Đã có tài khoản? <a href="login.html" style="color: var(--accent-primary);">Đăng nhập</a>
      </p>
    </div>
  </div>
  <script type="module" src="../../../assets/js/auth-register.js"></script>
  <script type="module" src="../../../assets/js/app-shell.js"></script>
</body>
</html>
